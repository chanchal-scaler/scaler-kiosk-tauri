<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scaler Kiosk</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #000;
      color: #6b7280;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      cursor: none;
    }
    p { font-size: 1rem; }
  </style>
</head>
<body>
  <!-- Shown on every display except the one running the exam. -->
  <p>This display is disabled while Scaler Kiosk is running.</p>
</body>
</html>
