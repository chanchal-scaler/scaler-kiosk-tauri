<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scaler Kiosk</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b1020;
      color: #e8ecf5;
      -webkit-user-select: none;
      user-select: none;
    }
    main { text-align: center; max-width: 36rem; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
    p { margin: 0.35rem 0; line-height: 1.5; }
    .muted { color: #9aa4b8; }
    .error { color: #ffb4a8; }
    .small { font-size: 0.85rem; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Starting secure browser…</h1>
    <p id="status" class="muted">Checking your connection.</p>
    <p id="hint" class="muted small"></p>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
